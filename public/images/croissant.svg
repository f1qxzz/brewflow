<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B2D8B"/>
      <stop offset="100%" stop-color="#CE93D866"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>

  <!-- Subtle pattern overlay -->
  <g opacity="0.05" fill="#F3E5F5">
    
    <circle cx="60" cy="40" r="30"/>
    
    <circle cx="180" cy="100" r="40"/>
    
    <circle cx="300" cy="160" r="50"/>
    
    <circle cx="420" cy="220" r="60"/>
    
    <circle cx="540" cy="280" r="70"/>
    
    <circle cx="660" cy="340" r="80"/>
    
  </g>

  <!-- Emoji (large, centered) -->
  <text
    x="200" y="165"
    font-size="110"
    text-anchor="middle"
    dominant-baseline="middle"
    filter="url(#shadow)"
  >🥐</text>

  <!-- Food/drink name -->
  <text
    x="200" y="280"
    font-size="26"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="700"
    fill="#F3E5F5"
    letter-spacing="0.5"
  >Croissant Butter</text>

  <!-- Category tag -->
  <rect x="140" y="330" width="120" height="28" rx="14" fill="#F3E5F522"/>
  <text
    x="200" y="349"
    font-size="11"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="system-ui, sans-serif"
    font-weight="600"
    fill="#F3E5F5"
    opacity="0.8"
    letter-spacing="1"
  >SNACKS</text>

  <!-- Decorative circle -->
  <circle cx="350" cy="60" r="40" fill="#F3E5F5" opacity="0.07"/>
  <circle cx="50" cy="360" r="30" fill="#F3E5F5" opacity="0.05"/>
</svg>